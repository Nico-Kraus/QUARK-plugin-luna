[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools-scm

[tool.poetry]
name = "QUARK-plugin-luna"
version = "0.1.0"
description = "QUARK plugin that provides interface to AQARIOS' Luna framework"
authors = [
    "Nico Kraus <nico.kraus@aqarios.com>",
    "Daniel Porawski <daniel.porawski@aqarios.com>"
]
readme = "README.md"
homepage = "https://github.com/Nico-Kraus/QUARK-plugin-luna"
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.12,<3.14" 
quark-framework = ">=0.1.9"
luna-quantum = "1.0.3"
numpy = ">=2.2.3"
dimod = ">=0.12.0"
pyscipopt = ">=5.0.1"

[project.urls]
Homepage = "https://github.com/Nico-Kraus/QUARK-plugin-luna"

[project]
name = "QUARK-plugin-luna"
dynamic = ["version"]
authors = [
    { name = "Nico Kraus", email = "nico.kraus@aqarios.com"},
    { name = "Daniel Porawski", email = "daniel.porawski@aqarios.com"}
]
description = "QUARK plugin that provides interface to AQARIOS' Luna framework"
readme = "README.md"
requires-python = ">=3.12,<3.14" 
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "Apache-2.0" }
dependencies = ["quark-framework>=0.1.9", "luna-quantum==1.0.3", "numpy>=2.2.3", "dimod>=0.12.0", "pyscipopt>=5.0.1"]
